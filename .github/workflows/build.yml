name: Build microsocks for ARMv7

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-armv7:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download & Extract Toolchain
      run: |
        # 创建工具链目录
        mkdir -p $HOME/toolchain
        cd $HOME/toolchain
        
        # 使用更稳定、速度快的 musl-cross 工具链
        URL="https://more.musl.cc/10/x86_64-linux-musl/armv7l-linux-musleabihf-cross.tgz"
        echo "Downloading toolchain from $URL..."
        curl -sSL "$URL" -o toolchain.tgz
        
        # 解压并校验
        tar -zxf toolchain.tgz
        rm toolchain.tgz
        
        # 将工具链路径添加到系统 PATH
        echo "$HOME/toolchain/armv7l-linux-musleabihf-cross/bin" >> $GITHUB_PATH

    - name: Clone microsocks source code
      run: |
        git clone https://github.com/rofl0r/microsocks.git

    - name: Compile microsocks statically
      run: |
        cd microsocks
        # 使用纯静态链接编译
        make CC=armv7l-linux-musleabihf-gcc LDFLAGS="-static"
        # 剥离符号表以压缩文件体积
        armv7l-linux-musleabihf-strip microsocks

    - name: Check binary properties
      run: |
        file microsocks/microsocks
        ls -lh microsocks/microsocks

    - name: Upload compiled binary as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: microsocks-armv7l-static
        path: microsocks/microsocks

name: Build microsocks for ARMv7

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-armv7:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install ARMv7 cross compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-linux-gnueabihf strip-nongnu

    - name: Clone microsocks source code
      run: |
        git clone https://github.com/rofl0r/microsocks.git

    - name: Compile microsocks statically
      run: |
        cd microsocks
        # 使用系统自带的 arm-linux-gnueabihf-gcc 进行全静态链接编译
        make CC=arm-linux-gnueabihf-gcc LDFLAGS="-static"
        # 剥离符号表以压缩文件体积
        arm-linux-gnueabihf-strip microsocks

    - name: Check binary properties
      run: |
        file microsocks/microsocks
        ls -lh microsocks/microsocks

    - name: Upload compiled binary as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: microsocks-armv7l-static
        path: microsocks/microsocks

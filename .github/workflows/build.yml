name: Build microsocks for ARMv7 (Soft Float)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-armv7-softfloat:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install ARMEL (Soft-Float) cross compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-linux-gnueabi

    - name: Clone microsocks source code
      run: |
        git clone https://github.com/rofl0r/microsocks.git

    - name: Compile microsocks statically with Soft-Float
      run: |
        cd microsocks
        # -mfloat-abi=soft 强制纯软件模拟浮点运算，彻底关闭硬件 FPU/VFP 指令
        make CC=arm-linux-gnueabi-gcc \
             CFLAGS="-O2 -march=armv7-a -mfloat-abi=soft" \
             LDFLAGS="-static"
             
        # 剥离符号表压缩体积
        arm-linux-gnueabi-strip microsocks

    - name: Check binary properties
      run: |
        file microsocks/microsocks
        ls -lh microsocks/microsocks

    - name: Upload compiled binary as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: microsocks-zx279128r-softfloat
        path: microsocks/microsocks
